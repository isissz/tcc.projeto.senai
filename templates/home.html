<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almoxarifado - Lista de Materiais</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="static/style2.css">
    <link rel="icon" type="image/png" href="static/iconecaixa.png">
    
    <style>
        h2 { 
            text-align: center; 
            margin-bottom: 25px;
            color: #334155; 
            font-weight: 700;
            text-transform: uppercase;
            font-size: 20px;
            letter-spacing: 0.5px;
        }

        .container-tabela {
            background-color: #ffffff;
            width: 100%;
            max-width: 950px; 
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        .custom-header {
            background-color: #f8fafc;
            border-bottom: 2px solid #cbd5e1;
        }
        
        .custom-header th {
            background-color: #f8fafc;
            color: #334155;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
            padding: 14px;
            border-bottom: 2px solid #cbd5e1;
        }

        .table th, .table td {
            vertical-align: middle;
            padding: 12px 14px;
            color: #334155;
            font-size: 14px;
            border-bottom: 1px solid #e2e8f0;
        }

        .badge-qtd {
            background-color: #f1f5f9;
            color: #334155;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="barra-topo"> 
        <nav id="navlateral" class="navbar navbar-light">
            <div class="container-fluid p-0">
                <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
                    <div class="offcanvas-header">
                        <h5 class="offcanvas-title" id="offcanvasNavbarLabel">Menu de Navegação</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                    </div>
                    <div class="offcanvas-body">
                        <ul class="navbar-nav justify-content-start flex-grow-1 pe-3">
                            <li class="nav-item mb-2">
                                <a class="nav-link" href="/">
                                    <img src="static/login-user-name-1.png" alt="Login Icon" class="me-2" style="width: 16px; height: 16px; object-fit: contain;">Login
                                </a> 
                            </td>
                            <li class="nav-item">
                                <a class="nav-link active" aria-current="page" href="/home">
                                    <img src="static/List.png" alt="List Icon" class="me-2" style="width: 16px; height: 16px; object-fit: contain;">Lista de Materiais
                                </a>
                            </td>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
        <img src="static/senaioficial.png" alt="Logo">
    </div>

    <main class="main-wrapper">
        <div class="container-tabela">

            <div class="text-center mb-4">
                <img src="static/senaioficial.png" width="350" height="85" alt="Logo SENAI">
            </div>
        

            <h3 style="color:#002A54; text-align:center; font-weight:700; margin-bottom:25px;">
                LISTA DE MATERIAIS DO ALMOXARIFADO
            </h3>
            <div class="table-responsive">
                <table class="table table-hover m-0">
                    <thead class="custom-header">
                        <tr>
                            <th scope="col" style="width: 10%;">ID</th>
                            <th scope="col" style="width: 15%;">Foto</th>
                            <th scope="col" style="width: 30%;">Nome</th>
                            <th scope="col" style="width: 10%;">Qtd</th>
                            <th scope="col" style="width: 20%;">Descrição</th>
                            <th scope="col" style="width: 15%; text-align: center;">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for produto in produtos %}
                        <tr id="produto-row-{{ produto[0] }}">
                            <th scope="row" style="font-weight: 600;">{{ produto[0] }}</th>
                            <td>
                                <button type="button" class="btn btn-outline-primary btn-sm" onclick="mostrar_foto('{{produto[5]}}')">
                                    <i class="fa-solid fa-eye"></i> Visualizar
                                </button>
                            
                                <div class="modal fade" id="fotoModal-{{ produto[0] }}" tabindex="-1" aria-labelledby="fotoModalLabel-{{ produto[0] }}" aria-hidden="true">
                                    <div class="modal-dialog modal-dialog-centered">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <h5 class="modal-title" id="fotoModalLabel-{{ produto[0] }}">{{ produto[1] }}</h5>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                            </div>
                                            <div class="modal-body text-center">
                                                <img src="{{ produto[4] }}" alt="{{ produto[1] }}" class="img-fluid rounded" style="max-height: 400px; object-fit: contain;">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </td>
                            <td>{{ produto[1] }}</td>
                            <td><span class="badge-qtd">{{ produto[2] }}</span></td>
                            <td>{{ produto[3] }}</td>
                            <td style="text-align: center;">
                                <button type="button" class="btn btn-outline-danger btn-sm" onclick="deletarProduto('{{ produto[0] }}')">
                                    <i class="fa-solid fa-trash-can"></i> Excluir
                                </button>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="static/script.js"></script>

    <script>
    function deletarProduto(id) {
        if (confirm("Tem certeza que deseja excluir este produto?")) {

            fetch(`/excluir/${id}`, {
                method: 'DELETE', 
            })
            .then(response => {
                if (response.ok) {

                    const linha = document.getElementById(`produto-row-${id}`);
                    if (linha) {
                        linha.remove();
                    }
                } else {
                    alert("Erro ao tentar excluir o produto.");
                }
            })
            .catch(error => {
                console.error("Erro:", error);
                alert("Erro de comunicação com o servidor.");
            });
        }
    }

    function mostrar_foto(arg){
        console.log(arg)
        Swal.fire({
        imageUrl: arg,
});
    }
    </script>
</body>
</html>
