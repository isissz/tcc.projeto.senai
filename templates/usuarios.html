<div class="main-wrapper">
    <div class="container-formulario">

            <div class="text-center mb-4">
                <img src="static/senaioficial.png" width="350" height="85" alt="Logo SENAI">
            </div>
       

            <h3 style="color:#002A54; text-align:center; font-weight:700; margin-bottom:25px;">
                CADASTRO DE USUÁRIO
            </h3>

            <form action="/usuarios" method="POST" id="formUsuario">
                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="fa-solid fa-tag me-2"></i>Nome</span>
                    <input type="text" class="form-control" placeholder="Nome de usuário" name="nome" required>
                </div>

                <div class="input-group mb-3">
                    <span class="input-group-text"><i class="fa-solid fa-list-ol me-2"></i>Senha</span>
                    <input type="password" class="form-control" placeholder="Mínimo de 8 caracteres" name="senha" minlength="8" required>
                </div>

                <div class="input-group mb-3">
                    <span class="input-group-text">Categoria / Permissão</span>
                    <select name="permissao" id="categoriaUsuarios" class="form-control" required>
                        <option value="">Selecione</option>
                        <option value="comum">Usuário Comum</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>

                <button type="submit" class="btn-enviar mt-3">
                    Adicionar
                </button>
            </form>

    </div>
 </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
